<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macros</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--bd:#e3e1da;--ac:#2f7d4f;--p:#d9534f;--c:#e0a030;--f:#4a7fc1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--card:#222320;--tx:#ecebe6;--mu:#98978f;--bd:#34352f;--ac:#5fbf86;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161715;--card:#222320;--tx:#ecebe6;--mu:#98978f;--bd:#34352f;--ac:#5fbf86;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 12px 96px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:14px;margin:0 0 10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;min-width:0}
input[type=number]{width:80px}
button{cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.x{border:none;background:none;color:var(--mu);padding:4px 8px;font-size:18px}
.grow{flex:1}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:6px;background:var(--card);border-top:1px solid var(--bd);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;border:none;background:none;color:var(--mu);font-size:15px;border-radius:12px}
.tabs button.on{background:var(--ac);color:#fff;font-weight:600}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--ac)}
.mr{display:flex;justify-content:space-between;font-size:14px}
.big{font-size:30px;font-weight:700}
.mu{color:var(--mu)}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd)}
.item small{color:var(--mu);display:block}
.mt{font-weight:600;margin-top:10px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
details summary{cursor:pointer;color:var(--mu);font-weight:600}
.empty{color:var(--mu);text-align:center;padding:10px}
.hd{cursor:pointer}
button,input,select{min-height:44px}
.x{min-width:44px}
.w{width:100%;display:block;margin-bottom:8px}
input[type=date]{width:100%}
</style>
</head>
<body>
<main>
<h1>Macros</h1>
<div class="tabs"><button id="t1" class="on">🍽️ Hoje</button><button id="t2">📅 Histórico</button></div>

<section id="v1">
<div class="card">
  <input type="date" id="date">
  <div style="margin:10px 0 4px"><span class="big" id="tk">0</span> <span class="mu">/ <span id="gk"></span> kcal</span> <span id="rest" class="mu" style="font-size:14px"></span></div>
  <div class="bar"><i id="pb" style="width:0"></i></div>
  <div id="macs"></div>
</div>

<div class="card">
  <h2>Adicionar</h2>
  <select id="meal" class="w"></select>
  <input class="w" id="food" list="foods" placeholder="Alimento…" autocomplete="off">
  <datalist id="foods"></datalist>
  <div class="row">
    <input type="number" id="grams" class="grow" placeholder="gramas" min="0" inputmode="decimal">
    <button class="pri grow" id="add">Adicionar</button>
  </div>
  <div id="prev" class="mu" style="font-size:14px;margin-top:8px"></div>
  <div style="margin-top:10px" id="photoWrap" hidden>
    <div class="mu" style="font-size:14px;margin-bottom:6px">Foto da refeição (IA)</div>
    <div class="row"><button class="grow" id="photoBtn">📷 Tirar foto</button><button class="grow" id="galBtn">🖼️ Galeria</button></div>
    <input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
    <input type="file" id="galIn" accept="image/*" hidden>
  </div>
  <div id="ph" hidden style="margin-top:10px"></div>
</div>

<div class="card">
  <h2>Registo do dia</h2>
  <div id="log"></div>
  <div style="margin-top:10px"><button id="clear">Limpar dia</button></div>
</div>

<div class="card">
  <details>
    <summary>Objetivos diários</summary>
    <div class="row" style="margin-top:12px">
      <label class="mu">kcal <input type="number" id="ok"></label>
      <label class="mu">Prot. <input type="number" id="op"></label>
      <label class="mu">Hidr. <input type="number" id="oc"></label>
      <label class="mu">Gord. <input type="number" id="of"></label>
    </div>
  </details>
</div>

<div class="card">
  <details>
    <summary>Alimentos (por 100 g)</summary>
    <div class="row" style="margin:12px 0">
      <input class="grow" id="nn" placeholder="Nome">
      <input type="number" id="nk" placeholder="kcal" step="any">
      <input type="number" id="np" placeholder="prot" step="any">
      <input type="number" id="nc" placeholder="hidr" step="any">
      <input type="number" id="nf" placeholder="gord" step="any">
      <button class="pri" id="nadd">Guardar</button>
    </div>
    <div id="flist"></div>
  </details>
</div>
</section>

<section id="v2" hidden>
  <div class="card"><h2>Média dos últimos 7 dias registados</h2><div id="avg"></div></div>
  <div class="card"><h2>Dias</h2><div id="hist"></div></div>
</section>
</main>

<script>
const DEF=[["Arroz cozido",130,2.7,28,0.3],["Massa cozida",158,5.8,31,0.9],["Batata cozida",87,1.9,20,0.1],["Aveia",389,16.9,66,6.9],["Pão de trigo",265,9,49,3.2],["Peito de frango grelhado",165,31,0,3.6],["Ovo",143,13,0.7,9.5],["Atum em água",116,26,0,1],["Salmão",208,20,0,13],["Iogurte grego natural",97,9,4,5],["Leite meio-gordo",46,3.3,4.8,1.6],["Banana",89,1.1,23,0.3],["Maçã",52,0.3,14,0.2],["Brócolos",34,2.8,7,0.4],["Amêndoas",579,21,22,50],["Azeite",884,0,0,100],["Whey (pó)",400,80,8,6]].map(a=>({n:a[0],k:a[1],p:a[2],c:a[3],f:a[4]}));
const M=["Pequeno-almoço","Almoço","Lanche","Jantar","Outros"];
const MAC=[["p","Proteína","--p"],["c","Hidratos","--c"],["f","Gordura","--f"]];
const $=id=>document.getElementById(id);
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let foods=load("m_foods",DEF), logs=load("m_logs",{});
let goals=Object.assign({k:2000,p:120,c:220,f:65},load("m_goals",{}));
const oldG=load("m_goal",null); if(oldG&&!load("m_goals",null))goals.k=oldG;
const r1=x=>Math.round(x*10)/10;
const pct=(a,b)=>b?Math.min(100,a/b*100):0;
const sum=L=>L.reduce((a,e)=>({k:a.k+e.k,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f}),{k:0,p:0,c:0,f:0});
const find=n=>foods.find(f=>f.n.toLowerCase()===n.trim().toLowerCase());
const calc=(f,g)=>{const m=g/100;return{n:f.n,g,k:f.k*m,p:f.p*m,c:f.c*m,f:f.f*m}};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const line=e=>`${Math.round(e.k)} kcal · P ${r1(e.p)} · H ${r1(e.c)} · G ${r1(e.f)}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("date").value=today();
$("meal").innerHTML=M.map(m=>`<option>${m}</option>`).join("");
{const h=new Date().getHours();$("meal").value=h<11?M[0]:h<15?M[1]:h<18?M[2]:M[3]}

function render(){
  $("foods").innerHTML=foods.map(f=>`<option value="${esc(f.n)}">`).join("");
  const d=$("date").value, L=logs[d]||[], t=sum(L);
  $("tk").textContent=Math.round(t.k);$("gk").textContent=goals.k;
  $("pb").style.width=pct(t.k,goals.k)+"%";
  $("rest").textContent=goals.k?(t.k<=goals.k?`· faltam ${Math.round(goals.k-t.k)}`:`· +${Math.round(t.k-goals.k)} acima`):"";
  $("macs").innerHTML=MAC.map(([x,l,v])=>`<div class="mr"><span><i class="dot" style="background:var(${v})"></i>${l}</span><span>${r1(t[x])} / ${goals[x]} g</span></div><div class="bar"><i style="width:${pct(t[x],goals[x])}%;background:var(${v})"></i></div>`).join("");
  let h="";
  M.forEach(m=>{
    const its=L.map((e,i)=>({e,i})).filter(o=>(o.e.m||"Outros")===m);
    if(!its.length)return;
    const s=sum(its.map(o=>o.e));
    h+=`<div class="mt">${m} <span class="mu" style="font-weight:400;font-size:14px">· ${Math.round(s.k)} kcal</span></div>`+its.map(({e,i})=>`<div class="item"><div class="grow">${esc(e.n)} · ${r1(e.g)} g<small>${line(e)}</small></div><button class="x" data-i="${i}" aria-label="Apagar">×</button></div>`).join("");
  });
  $("log").innerHTML=h||'<div class="empty">Ainda nada registado.</div>';
  $("ok").value=goals.k;$("op").value=goals.p;$("oc").value=goals.c;$("of").value=goals.f;
  $("flist").innerHTML=foods.map((f,i)=>`<div class="item"><div class="grow">${esc(f.n)}<small>${f.k} kcal · P ${f.p} · H ${f.c} · G ${f.f}</small></div><button class="x" data-fi="${i}" aria-label="Apagar">×</button></div>`).join("");
  preview();
}
function preview(){
  const f=find($("food").value),g=+$("grams").value;
  $("prev").textContent=f&&g>0?line(calc(f,g)):"";
}
function renderHist(){
  const days=Object.keys(logs).filter(d=>logs[d].length).sort().reverse().slice(0,30);
  if(!days.length){$("avg").innerHTML=$("hist").innerHTML='<div class="empty">Sem dias registados.</div>';return}
  const n=Math.min(7,days.length), a={k:0,p:0,c:0,f:0};
  days.slice(0,n).forEach(d=>{const t=sum(logs[d]);for(const x in a)a[x]+=t[x]/n});
  $("avg").innerHTML=`<div><span class="big">${Math.round(a.k)}</span> <span class="mu">kcal/dia</span></div><div class="mu" style="font-size:14px">P ${r1(a.p)} g · H ${r1(a.c)} g · G ${r1(a.f)} g (${n} ${n>1?"dias":"dia"})</div>`;
  $("hist").innerHTML=days.map(d=>{const t=sum(logs[d]);
    const nm=new Date(d+"T12:00").toLocaleDateString("pt-PT",{weekday:"short",day:"numeric",month:"short"});
    return `<div class="item hd" data-d="${d}"><div class="grow"><div class="mr"><b>${nm}</b><span>${Math.round(t.k)} kcal</span></div><div class="bar" style="margin:6px 0 4px"><i style="width:${pct(t.k,goals.k)}%"></i></div><small>P ${r1(t.p)} · H ${r1(t.c)} · G ${r1(t.f)}</small></div></div>`}).join("");
}
function tab(n){$("v1").hidden=n!==1;$("v2").hidden=n!==2;$("t1").classList.toggle("on",n===1);$("t2").classList.toggle("on",n===2);if(n===2)renderHist()}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
$("hist").onclick=e=>{const r=e.target.closest("[data-d]");if(!r)return;$("date").value=r.dataset.d;render();tab(1)};

function push(list){const d=$("date").value;(logs[d]=logs[d]||[]).push(...list);save("m_logs",logs);render()}
$("add").onclick=()=>{
  const f=find($("food").value),g=+$("grams").value;
  if(!f){$("prev").textContent="Alimento não encontrado. Adiciona-o em “Alimentos”.";return}
  if(!(g>0))return;
  push([Object.assign(calc(f,g),{m:$("meal").value})]);
  $("food").value="";$("grams").value="";$("food").focus();
};
$("grams").addEventListener("keydown",e=>{if(e.key==="Enter")$("add").click()});
$("food").oninput=$("grams").oninput=preview;
$("date").onchange=render;
$("log").onclick=e=>{const i=e.target.dataset.i;if(i===undefined)return;logs[$("date").value].splice(i,1);save("m_logs",logs);render()};
$("clear").onclick=()=>{if(confirm("Limpar todos os registos deste dia?")){delete logs[$("date").value];save("m_logs",logs);render()}};
[["ok","k"],["op","p"],["oc","c"],["of","f"]].forEach(([id,k])=>$(id).onchange=()=>{goals[k]=+$(id).value||0;save("m_goals",goals);render()});
$("nadd").onclick=()=>{
  const n=$("nn").value.trim();if(!n)return;
  const o={n,k:+$("nk").value||0,p:+$("np").value||0,c:+$("nc").value||0,f:+$("nf").value||0};
  const i=foods.findIndex(f=>f.n.toLowerCase()===n.toLowerCase());
  if(i>=0)foods[i]=o;else foods.push(o);
  foods.sort((a,b)=>a.n.localeCompare(b.n,"pt"));save("m_foods",foods);
  ["nn","nk","np","nc","nf"].forEach(x=>$(x).value="");render();
};
$("flist").onclick=e=>{const i=e.target.dataset.fi;if(i===undefined)return;foods.splice(i,1);save("m_foods",foods);render()};

/* ---- Foto + IA ---- */
let sample=null, phItems=[];
(async()=>{
  try{
    if(!window.claude)return;
    const s=await claude.use("sample"); if(!s)return;
    const l=await s.limits(); if(!l||!l.images)return;
    sample=s; $("photoWrap").hidden=false;
  }catch(e){}
})();
const PROMPT="Analisa esta foto de uma refeição. Identifica cada alimento visível, estima o peso em gramas da porção que se vê e os valores nutricionais dessa porção. Responde APENAS com JSON, sem texto extra nem markdown, neste formato: {\"itens\":[{\"nome\":\"\",\"gramas\":0,\"kcal\":0,\"p\":0,\"c\":0,\"g\":0}]} onde p é proteína, c hidratos de carbono e g gordura, todos em gramas. Nomes em português de Portugal. Se não houver comida na foto, responde {\"itens\":[]}.";
async function shrink(file){
  const img=await createImageBitmap(file), s=Math.min(1,1024/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",.85));
}
$("photoBtn").onclick=()=>$("photoIn").click();
$("galBtn").onclick=()=>$("galIn").click();
$("photoIn").onchange=$("galIn").onchange=async e=>{
  const file=e.target.files[0];e.target.value="";
  if(!file||!sample)return;
  $("ph").hidden=false;$("ph").innerHTML='<div class="empty">A analisar a foto…</div>';
  try{
    const blob=await shrink(file);
    const r=await sample.json(PROMPT,{images:[blob],cache:false});
    phItems=(r.itens||[]).filter(i=>+i.gramas>0).map(i=>{const g=+i.gramas;return{n:String(i.nome),g,r:{k:i.kcal/g,p:i.p/g,c:i.c/g,f:i.g/g}}});
    renderPh();
  }catch(err){
    $("ph").innerHTML=`<div class="empty">${err&&err.code==="not_granted"?"Permissão recusada.":"Não consegui analisar a foto. Tenta outra vez."}</div>`;
  }
};
const phE=i=>{const o=phItems[i];return{n:o.n,g:o.g,k:o.r.k*o.g,p:o.r.p*o.g,c:o.r.c*o.g,f:o.r.f*o.g}};
function renderPh(){
  if(!phItems.length){$("ph").innerHTML='<div class="empty">Não encontrei comida na foto.</div>';return}
  $("ph").innerHTML='<div class="mu" style="font-size:14px;margin-bottom:4px">Estimativa da IA, ajusta as gramas se for preciso:</div>'+
    phItems.map((o,i)=>`<div class="item"><div class="grow">${esc(o.n)}<small id="pl${i}">${line(phE(i))}</small></div><input type="number" data-pg="${i}" value="${Math.round(o.g)}"> g<button class="x" data-pd="${i}">×</button></div>`).join("")+
    `<div class="row" style="margin-top:10px"><button class="pri" id="phAdd">Adicionar ao registo</button><button id="phNo">Cancelar</button></div>`;
}
$("ph").oninput=e=>{const i=e.target.dataset.pg;if(i===undefined)return;phItems[i].g=+e.target.value||0;$("pl"+i).textContent=line(phE(i))};
$("ph").onclick=e=>{
  if(e.target.dataset.pd!==undefined){phItems.splice(e.target.dataset.pd,1);renderPh()}
  else if(e.target.id==="phNo"){$("ph").hidden=true;phItems=[]}
  else if(e.target.id==="phAdd"){push(phItems.map((_,i)=>Object.assign(phE(i),{m:$("meal").value})).filter(x=>x.g>0));$("ph").hidden=true;phItems=[]}
};
render();
</script>
</body>
</html>
